<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!--
    蝴蝶餅：左右兩個上環加一段底弧。由 scripts/make-favicon.mjs 產生，
    要改形狀請改那支腳本再重跑，不要直接手改這裡——PNG 與 ICO 是同一組數字算出來的。
  -->
  <g stroke="rgb(208 138 46)" stroke-linecap="round">
  <circle cx="48" cy="46" r="17" stroke-width="10" />
  <circle cx="80" cy="46" r="17" stroke-width="10" />
  <circle cx="64" cy="56" r="40" stroke-width="10" clip-path="inset(26px 0 0 0)" />
  </g>
</svg>
