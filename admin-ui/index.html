<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noah Portfolio 後台（本機）</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar__logo">N</div>
        <nav class="sidebar__nav">
          <button class="sidebar__item sidebar__item--active" data-page="home" title="Home">
            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9h14v-9" /></svg>
          </button>
          <button class="sidebar__item" data-page="gallery" title="Gallery">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="8.5" cy="9" r="1.6" /><path d="m21 15-5-5-11 11" /></svg>
          </button>
          <button class="sidebar__item" data-page="portfolio" title="Portfolio">
            <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
          </button>
          <button class="sidebar__item" data-page="content" title="Content 文案">
            <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z" /><path d="M15 3v3h3" /><path d="M9 12h6" /><path d="M9 16h6" /><path d="M9 8h2" /></svg>
          </button>
        </nav>
        <div class="sidebar__spacer"></div>
        <button class="sidebar__item" data-page="settings" disabled title="設定（尚未開放）">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z" /></svg>
        </button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar__row">
            <div class="topbar__heading">
              <h1 class="topbar__title" id="pageTitle">Gallery 相簿</h1>
              <p class="topbar__meta" id="pageMeta">載入中…</p>
            </div>
            <button class="publish-btn" id="publishBtn" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
              <span id="publishBtnLabel">發布</span>
              <span class="publish-btn__count" id="publishCount" hidden></span>
            </button>
          </div>
          <div class="topbar__tabs" id="pageTabs"></div>
        </header>

        <!-- 發布前的確認面板：列出這次會送出什麼、留在本機的有哪些，確認後才執行 -->
        <div class="publish-panel" id="publishPanel" hidden>
          <div class="publish-panel__head">
            <strong>確認發布內容</strong>
            <button class="publish-panel__close" id="publishClose" type="button">關閉</button>
          </div>
          <div class="publish-panel__body" id="publishBody"></div>
          <div class="publish-panel__foot">
            <span id="publishHint"></span>
            <button class="publish-btn publish-btn--go" id="publishConfirm" type="button">確定發布</button>
          </div>
        </div>

        <section class="content" id="content"></section>
      </main>

      <aside class="preview" id="previewPanel">
        <div class="preview__header">
          <select id="previewPageSelect" class="preview__select"></select>
          <div class="preview__controls">
            <button id="previewLocaleToggle" class="preview__btn" title="切換語言">EN</button>
            <button id="previewRefresh" class="preview__btn" title="重新整理">
              <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 4v6h-6" /></svg>
            </button>
            <button id="previewCollapse" class="preview__btn" title="收合／展開預覽">
              <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" /></svg>
            </button>
          </div>
        </div>
        <iframe id="previewFrame" class="preview__frame" title="頁面即時預覽"></iframe>
      </aside>
    </div>

    <input type="file" id="fileInput" accept="image/*" hidden />

    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox__backdrop"></div>
      <div class="lightbox__panel">
        <button class="lightbox__close" id="lightboxClose" title="關閉">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <div class="lightbox__image-wrap">
          <img id="lightboxImage" alt="" />
        </div>
        <dl class="lightbox__info" id="lightboxInfo"></dl>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
